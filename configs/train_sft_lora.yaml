model:
  path: /root/autodl-tmp/Qwen3.5-4B-ortho
  use_4bit: true
  attn_implementation: sdpa

data:
  path: reward_seed.json
  target: chosen
  max_length: 4096
  exclude_indices:
    - 28
  max_target_chars: 12000

output:
  dir: /root/autodl-tmp/UniAlign-sft-ortho-lora

training:
  epochs: 15
  max_steps: -1
  learning_rate: 5.0e-5
  batch_size: 2
  grad_accum: 2
  logging_steps: 1
  save_steps: 20
  seed: 42


lora:
  r: 64
  alpha: 128
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

wandb:
  enabled: true
  project: unialign
  entity: null
  mode: online
  run_name: null
  group: qwen35-sft-lora
  report_model: false

runtime:
  fla_tilelang: "0"
  triton_f32_default: ieee
